<div class="row justify-content-center text-center">
  <h2 class="blue-bg">Learning Path</h2>
  <div class="col-11 bg-white path-box l-speed">
    <h5 class="my-3 mb-5">Choose the path that best fits how you are learning {{ environment.LANGUAGE }}.</h5>
    <div class="path-wrap-scroll">
      @for (path of learningPaths; track path; let i = $index) {
        <div class="path-check">
          <div class="row">
            <div class="col-5 my-auto">
              <dl>
                <dt>{{ path.label }}</dt>
              </dl>
            </div>
            <div class="col-4 my-auto">
              <dl>
                <dd>{{ path.description }}</dd>
              </dl>
            </div>
            <div class="col-3 my-auto form-check">
              <label class="form-check-label" for="radioStacked{{ i + 1 }}">
              </label>
              <input
                  id="radioStacked{{ i + 1 }}"
                  name="radio-stacked"
                  value="{{ path.id }}"
                  [(ngModel)]="pathModel.selected"
                  type="radio"
                  class="form-check-input"
                  required
                  />
            </div>
          </div>
        </div>
      }
    </div>
  </div>
  <div class="col d-flex">
    <button
      type="submit"
      class="btn btn-white mt-5 ms-auto"
      [ngClass]="{ disabled: !pathModel.selected }"
      (click)="submit()"
      >
      Next
    </button>
  </div>
</div>
