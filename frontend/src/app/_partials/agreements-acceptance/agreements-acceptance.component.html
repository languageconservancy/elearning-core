<div
    class="modal fade modal-n"
    id="agreements-modal"
    data-backdrop="static"
    tabindex="-1"
    role="dialog"
    aria-labelledby="AgreementsAcceptance"
>
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header text-center">
                <h3 class="modal-title">Review and Accept Agreements</h3>
            </div>
            <div class="modal-body modal-n-table">
                <div class="justify-content-center text-center">
                    <h5>
                        We now require explicit agreement to our terms in order to comply with
                        regulations.
                    </h5>
                    <!-- Tabs -->
                    <div class="">
                        <ul class="nav nav-tabs" id="myTab" role="tablist">
                            <li class="nav-item bg-white rounded-top-left-3 rounded-top-right-3">
                                <a
                                    class="nav-link rounded-top-left-3 rounded-top-right-3"
                                    [ngClass]="{
                                        active: activeTab === 'terms',
                                        'cursor-pointer': activeTab !== 'terms',
                                        'font-weight-bold': activeTab === 'terms',
                                    }"
                                    id="terms-tab"
                                    data-toggle="tab"
                                    role="tab"
                                    aria-controls="terms"
                                    aria-selected="true"
                                    (click)="onTabClick('terms')"
                                >
                                    Terms & Conditions
                                </a>
                            </li>
                            <li class="nav-item bg-white rounded-top-left-3 rounded-top-right-3">
                                <a
                                    class="nav-link cursor-pointer rounded-top-left-3 rounded-top-right-3"
                                    [ngClass]="{
                                        active: activeTab === 'privacy',
                                        'cursor-pointer': activeTab !== 'privacy',
                                        'font-weight-bold': activeTab === 'privacy',
                                    }"
                                    id="privacy-tab"
                                    data-toggle="tab"
                                    role="tab"
                                    aria-controls="privacy"
                                    aria-selected="false"
                                    (click)="onTabClick('privacy')"
                                >
                                    Privacy Policy
                                </a>
                            </li>
                        </ul>
                    </div>

                    <div class="bg-white path-box text-left l-speed mt-0 position-relative">
                        <!-- Terms and conditions content wrapper -->
                        <div
                            *ngIf="activeTab === 'terms'"
                            class="content-wrapper position-relative"
                        >
                            <div
                                class="path-wrap-scroll px-2 overflow-x-hidden pb-2"
                                (scroll)="onScroll('terms', $event)"
                                [innerHTML]="termsAndConditions.text | safeHtml"
                                #termsScrollContainer
                            ></div>
                            <!-- Scroll to bottom button for Terms -->
                            <button
                                *ngIf="!termsScrolledToBottom"
                                class="scroll-to-bottom-btn"
                                (click)="scrollToBottom('terms')"
                                type="button"
                                title="Scroll to bottom"
                            >
                                <i class="fas fa-chevron-down"></i>
                            </button>
                        </div>

                        <!-- Privacy policy content wrapper -->
                        <div
                            *ngIf="activeTab === 'privacy'"
                            class="content-wrapper position-relative"
                        >
                            <div
                                class="path-wrap-scroll px-2 overflow-x-hidden pb-2"
                                (scroll)="onScroll('privacy', $event)"
                                [innerHTML]="privacyPolicy.text | safeHtml"
                                #privacyScrollContainer
                            ></div>
                            <!-- Scroll to bottom button for Privacy -->
                            <button
                                *ngIf="!privacyScrolledToBottom"
                                class="scroll-to-bottom-btn"
                                (click)="scrollToBottom('privacy')"
                                type="button"
                                title="Scroll to bottom"
                            >
                                <i class="fas fa-chevron-down"></i>
                            </button>
                        </div>

                        <div class="mt-5 pt-2">
                            <!-- Checkbox to accept terms and conditions -->
                            <ng-container *ngIf="activeTab === 'terms'">
                                <input
                                    class="cursor-pointer"
                                    type="checkbox"
                                    id="termsAcceptance"
                                    [(ngModel)]="isTermsAccepted"
                                    (change)="onAcceptanceChange('terms', $event)"
                                    [disabled]="!termsHasBeenRead"
                                />
                                <label
                                    class="pl-2 label-default d-inline cursor-pointer"
                                    for="termsAcceptance"
                                    [ngClass]="{ 'text-disabled': !termsHasBeenRead }"
                                >
                                    I have read and accepted the terms and conditions.
                                </label>
                            </ng-container>

                            <!-- Checkbox to accept privacy policy -->
                            <ng-container *ngIf="activeTab === 'privacy'">
                                <input
                                    class="cursor-pointer"
                                    type="checkbox"
                                    id="privacyAcceptance"
                                    [(ngModel)]="isPrivacyAccepted"
                                    (change)="onAcceptanceChange('privacy', $event)"
                                    [disabled]="!privacyHasBeenRead"
                                />
                                <label
                                    class="pl-2 label-default d-inline cursor-pointer"
                                    for="privacyAcceptance"
                                    [ngClass]="{ 'text-disabled': !privacyHasBeenRead }"
                                >
                                    I have read and accepted the privacy policy.
                                </label>
                            </ng-container>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Next button -->
            <div class="modal-footer">
                <!-- Do not accept and delete account button -->
                <button
                    type="submit"
                    class="btn btn-secondary font-weight-normal"
                    (click)="rejectBtnPressed()"
                >
                    Reject
                </button>
                <button
                    [disabled]="!(isTermsAccepted && isPrivacyAccepted)"
                    type="submit"
                    class="btn btn-primary"
                    [ngClass]="{ 'pointer-events-none': !(isTermsAccepted && isPrivacyAccepted) }"
                    (click)="acceptBtnPressed()"
                >
                    Accept
                </button>
            </div>
        </div>
    </div>
</div>
